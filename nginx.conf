server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 纯前端单页应用，任何路径都回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源带内容哈希，可长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
